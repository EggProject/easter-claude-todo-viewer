<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — Modal</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="modal.css" />
  <link rel="stylesheet" href="../button/button.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px; min-height: 100vh; }
    .page { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    h1 { font: 400 36px/1.1 var(--ep-font-display); letter-spacing: -0.02em; color: var(--ep-fg); }
 h1 em { font-weight: 700; }
    .lead { font: var(--ep-text-body); color: var(--ep-fg-muted); max-width: 520px; }
    .label { font: var(--ep-text-overline); letter-spacing: var(--ep-track-overline); text-transform: uppercase; color: var(--ep-fg-subtle); margin-top: 14px; }
    /* Demo form fields (inside the form modal). Keyboard focus shows the design-system
       gold ring; text inputs justifiably show it on click too. Replaces the old inline
       outline:none that left these fields with no focus indicator. */
    .demo-field {
      background: var(--ep-bg-elevated);
      border: 1px solid var(--ep-border);
      border-radius: 8px;
      padding: 11px 14px;
      font: var(--ep-text-body);
      outline: none;
    }
    .demo-field:focus-visible { border-color: var(--ep-accent); box-shadow: var(--ep-shadow-focus); }
    textarea.demo-field { resize: vertical; font-family: inherit; }
    /* Forced colors (Windows High Contrast etc.): the box-shadow ring drops out and the
       accent border maps to a system color, so map the field to system colors and give
       :focus-visible a real Highlight outline that overrides the base outline:none.
       Covers both input.demo-field and textarea.demo-field via the shared selector. */
    @media (forced-colors: active) {
      .demo-field {
        background: Canvas;
        color: CanvasText;
        border-color: CanvasText;
      }
      .demo-field:focus-visible {
        border-color: Highlight;
        box-shadow: none;
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }
    }
  </style>
  <script src="../../assets/vendor/react.production.min.js"></script>
  <script src="../../assets/vendor/react-dom.production.min.js"></script>
  <script src="../../assets/vendor/babel.min.js"></script>
</head>
<body>
  <div class="page">
    <h1>Modal · <em>focused dialogs</em></h1>
    <p class="lead">A centered overlay for confirmations, forms and detail views. Four sizes; semantic icon variants for status.</p>
    <span class="label">Open a modal</span>
    <div class="row" id="root"></div>
  </div>

  <script type="text/babel" src="Modal.jsx"></script>
  <script type="text/babel">
    const { useState, useRef } = React;
    const ICON_INFO    = <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9v5M10 6.5v.01"/></svg>;
    const ICON_WARN    = <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M10 3 2.5 16h15z"/><path d="M10 8v4M10 14.5v.01"/></svg>;
    const ICON_DANGER  = <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round"><circle cx="10" cy="10" r="7"/><path d="M7 7l6 6M13 7l-6 6"/></svg>;

    function App() {
      const [which, set] = useState(null);
      const close = () => set(null);
      const infoBtnRef = useRef(null);   // returnFocusRef demo target (the info trigger)
      const nameInputRef = useRef(null); // initialFocusRef demo target (the form's first field)
      return (
        <>
          <button className="btn btn--primary" ref={infoBtnRef} aria-haspopup="dialog" aria-expanded={which === 'info'} onClick={() => set('info')}>Project details</button>
          <button className="btn btn--secondary" aria-haspopup="dialog" aria-expanded={which === 'confirm'} onClick={() => set('confirm')}>Confirm action</button>
          <button className="btn btn--secondary" aria-haspopup="dialog" aria-expanded={which === 'danger'} onClick={() => set('danger')}>Delete project</button>
          <button className="btn btn--ghost" aria-haspopup="dialog" aria-expanded={which === 'form'} onClick={() => set('form')}>New project</button>

          <Modal
            open={which === 'info'} onClose={close}
            returnFocusRef={infoBtnRef}
            eyebrow="Project · v1.0.0"
            title={<>Lumenwerk · <em>shipped on time</em></>}
            subtitle="Last activity 2 hours ago"
            size="md"
            footer={<>
              <button className="btn btn--ghost" onClick={close}>Close</button>
              <button className="btn btn--primary" onClick={close}>Open project</button>
            </>}
          >
            <p>A small senior team delivered the v1 release on March 14, two days ahead of schedule.
              All acceptance tests passed; deployment is live.</p>
            <p style={{color:'var(--ep-fg-muted)'}}>Next milestone: post-launch retro on April 2.</p>
          </Modal>

          <Modal
            open={which === 'confirm'} onClose={close}
            icon={ICON_WARN} iconVariant="warning"
            title="Unsaved changes"
            subtitle="Your edits to this brief have not been saved yet."
            size="sm"
            footer={<>
              <button className="btn btn--ghost" onClick={close}>Discard</button>
              <button className="btn btn--primary" onClick={close}>Save draft</button>
            </>}
          />

          <Modal
            open={which === 'danger'} onClose={close}
            icon={ICON_DANGER} iconVariant="danger"
            title="Delete project?"
            subtitle="This will remove Lumenwerk from your workspace. The action cannot be undone."
            size="sm"
            footer={<>
              <button className="btn btn--ghost" onClick={close}>Cancel</button>
              <button className="btn btn--danger" onClick={close}>Delete</button>
            </>}
          />

          <Modal
            open={which === 'form'} onClose={close}
            initialFocusRef={nameInputRef}
            eyebrow="Step 1 of 3"
            title={<>Start a <em>new project</em></>}
            size="lg"
            footer={<ModalFooter split left={<span style={{font:'var(--ep-text-meta)',color:'var(--ep-fg-subtle)'}}>Saved as draft</span>}>
              <button className="btn btn--ghost" onClick={close}>Cancel</button>
              <button className="btn btn--primary" onClick={close}>Continue →</button>
            </ModalFooter>}
          >
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <label style={{display:'flex',flexDirection:'column',gap:6}}>
                <span style={{font:'500 12px var(--ep-font-sans)',letterSpacing:'0.04em',textTransform:'uppercase',color:'var(--ep-fg-muted)'}}>Project name</span>
                <input ref={nameInputRef} className="demo-field" defaultValue="Northbeam · phase II"/>
              </label>
              <label style={{display:'flex',flexDirection:'column',gap:6}}>
                <span style={{font:'500 12px var(--ep-font-sans)',letterSpacing:'0.04em',textTransform:'uppercase',color:'var(--ep-fg-muted)'}}>Description</span>
                <textarea rows="3" className="demo-field" defaultValue="Continuation of the dashboards work — analytics, retention, export."/>
              </label>
            </div>
          </Modal>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
