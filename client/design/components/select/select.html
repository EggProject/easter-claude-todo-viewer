<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — Select & Combobox</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=720" />
  <link rel="stylesheet" href="select.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px; min-height: 100vh; }
    .page { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    h1 { font: 400 36px/1.1 var(--ep-font-display); letter-spacing: -0.02em; color: var(--ep-fg); }
 h1 em { font-weight: 700; }
    .lead { font: var(--ep-text-body); color: var(--ep-fg-muted); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field-stack { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font: 500 12px var(--ep-font-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ep-fg-muted); }
    /* ---- demo page chrome only (no component selectors) ---- */
    .demo-section { display: flex; flex-direction: column; gap: 12px; padding: 20px; background: var(--ep-bg-elevated); border: 1px solid var(--ep-border-subtle); border-radius: var(--ep-radius-lg); }
    .demo-h2 { font: 600 15px var(--ep-font-sans); color: var(--ep-fg); }
    .demo-note { font: var(--ep-text-small); line-height: 1.65; color: var(--ep-fg-muted); }
    .demo-note strong { color: var(--ep-fg); font-weight: 600; }
    .demo-output { font: var(--ep-text-small); color: var(--ep-fg-subtle); }
    .demo-output code, .demo-note code { font: 500 12px var(--ep-font-mono); background: var(--ep-bg-sunken); color: var(--ep-fg); padding: 1px 6px; border-radius: var(--ep-radius-sm); }
    .demo-form { display: flex; align-items: flex-end; gap: 12px; }
    .demo-form .field-stack { flex: 1; min-width: 0; }
    .demo-submit { flex: 0 0 auto; padding: 10px 16px; border: 1px solid var(--ep-ink-900); border-radius: var(--ep-radius-md); background: var(--ep-ink-900); color: var(--ep-paper-50); font: 500 14px var(--ep-font-sans); cursor: pointer; }
    .demo-submit:focus-visible { outline: none; box-shadow: var(--ep-shadow-focus); }
  </style>
  <script src="../../assets/vendor/react.production.min.js"></script>
  <script src="../../assets/vendor/react-dom.production.min.js"></script>
  <script src="../../assets/vendor/babel.min.js"></script>
</head>
<body>
  <div class="page">
    <h1>Select &amp; <em>combobox</em></h1>
    <p class="lead">A select with semantic options, and a typeahead combobox that filters as you type.</p>
    <div id="root"></div>
  </div>

  <script type="text/babel" src="Select.jsx"></script>
  <script type="text/babel">
    const STATUS_OPTS = [
      { value: 'draft',     label: 'Draft',          meta: 'D' },
      { value: 'inreview',  label: 'In review',      meta: 'R' },
      { value: 'shipped',   label: 'Shipped',        meta: 'S' },
      { value: 'archived',  label: 'Archived',       meta: 'A', disabled: true },
    ];
    const OWNER_OPTS = [
      { value: 'eszter', label: 'Eszter Kovács' },
      { value: 'janos',  label: 'János Tóth' },
      { value: 'lili',   label: 'Lili Bauer' },
    ];
    const CLIENT_OPTS = [
      { value: 'northbeam',  label: 'Northbeam' },
      { value: 'lumenwerk',  label: 'Lumenwerk' },
      { value: 'halifax',    label: 'Halifax & Co.' },
      { value: 'rivermark',  label: 'Rivermark Studio' },
      { value: 'kestrel',    label: 'Kestrel Health' },
      { value: 'pinewood',   label: 'Pinewood Bank' },
      { value: 'altan',      label: 'Altan Logistics' },
      { value: 'bluepeach',  label: 'Blue Peach Co.' },
      { value: 'westbrook',  label: 'Westbrook Financial Partners International' },
    ];
    const REGION_OPTS = [
      { value: 'emea', label: 'EMEA — Europe, Middle East & Africa' },
      { value: 'amer', label: 'Americas' },
      { value: 'apac', label: 'Asia-Pacific' },
    ];

    function App() {
      const [status, setStatus] = React.useState('inreview');
      const [owner, setOwner] = React.useState(null);
      const [client, setClient] = React.useState('northbeam');
      const [submitted, setSubmitted] = React.useState(null);

      const clientLabel = CLIENT_OPTS.find((o) => o.value === client)?.label ?? '—';

      // Reads the value the real <Combobox> submits via its own hidden input — no manual hidden input here.
      function handleSubmit(event) {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        setSubmitted(data.get('client'));
      }

      return (
        <React.Fragment>

          {/* ---- Select: two side-by-side instances prove per-instance isolation ---- */}
          <section className="demo-section">
            <h2 className="demo-h2">Select — button-based, select-only</h2>
            <div className="grid">
              <div className="field-stack">
                <span className="field-label" id="demo-status-label">Status</span>
                <Select id="demo-status-select" aria-labelledby="demo-status-label"
                        options={STATUS_OPTS} value={status} onChange={setStatus}/>
                <span className="demo-output">value: <code>{status}</code></span>
              </div>
              <div className="field-stack">
                <span className="field-label" id="demo-owner-label">Owner</span>
                <Select id="demo-owner-select" aria-labelledby="demo-owner-label" size="sm"
                        placeholder="Pick someone…" options={OWNER_OPTS} value={owner} onChange={setOwner}/>
                <span className="demo-output">value: <code>{owner ?? '—'}</code></span>
              </div>
            </div>
            <p className="demo-note">
              <strong>Keyboard:</strong> Enter / Space / ↓ / ↑ open; ↓ ↑ Home End move the active option;
              Enter / Space select; Esc closes; Tab closes and moves on — no printable-character typeahead.
              <strong> ARIA:</strong> a <code>role="combobox"</code> trigger with <code>aria-expanded</code> /
              <code>aria-controls</code> / <code>aria-activedescendant</code> over a <code>role="listbox"</code> /
              <code>role="option"</code> panel. The panel stays mounted but is <code>hidden</code> when closed
              (<code>aria-expanded="false"</code>, no pointer or assistive-tech access); opening one Select never
              opens the other. <strong>Contract:</strong> controlled-only (<code>value</code> + <code>onChange</code>,
              no <code>defaultValue</code>); UI-only — no <code>name</code>, no automatic form value, no root
              <code>disabled</code>, and re-selecting the current value still fires <code>onChange</code>.
            </p>
          </section>

          {/* ---- Combobox: searchable select bound to a real form ---- */}
          <section className="demo-section">
            <h2 className="demo-h2">Combobox — searchable select, form-bound</h2>
            <form className="demo-form" onSubmit={handleSubmit}>
              <div className="field-stack">
                <label className="field-label" htmlFor="demo-client-combobox">Client</label>
                <Combobox id="demo-client-combobox" name="client" options={CLIENT_OPTS}
                          value={client} onChange={setClient} placeholder="Search clients…"/>
              </div>
              <button type="submit" className="demo-submit">Submit</button>
            </form>
            <span className="demo-output">
              selected: <code>{clientLabel}</code> · form value: <code>{client}</code> · submitted: <code>{submitted ?? '—'}</code>
            </span>
            <p className="demo-note">
              <strong>Keyboard:</strong> type to filter and open; ↓ ↑ move; Enter selects the active option (with
              none active, Enter submits the form); Esc closes; Home / End move the text caret, not the list; IME
              composition is preserved. It is a <strong>searchable select</strong> — it never creates free-text
              values. With a <code>name</code> it renders a hidden input whose value is the selection value (not the
              label), so submitting sends <code>client=&lt;value&gt;</code> (e.g. <code>northbeam</code>, not
              “Northbeam”). The popup unmounts when closed; DOM focus stays on the input. A native form reset does not
              automatically overwrite the controlled value, and there is no <code>required</code> integration.
            </p>
          </section>

          {/* ---- Disabled Combobox ---- */}
          <section className="demo-section">
            <div className="field-stack">
              <label className="field-label" htmlFor="demo-region-combobox">Region</label>
              <Combobox id="demo-region-combobox" name="region" disabled
                        options={REGION_OPTS} value="emea" onChange={() => {}} placeholder="Search regions…"/>
            </div>
            <p className="demo-note">
              <strong>Disabled Combobox:</strong> the input is inert. Its hidden form input is also <code>disabled</code>,
              so a named disabled Combobox is excluded from <code>FormData</code>. (The React <code>Select</code> has no
              root <code>disabled</code> prop — only <code>Combobox</code> does.)
            </p>
          </section>

          {/* ---- Appearance + edge cases + limits ---- */}
          <section className="demo-section">
            <p className="demo-note">
              <strong>Appearance:</strong> the Select trigger (and the native static <code>&lt;select&gt;</code> used
              on static pages) show a <code>:focus-visible</code> ring; the Combobox input shows it on <code>:focus</code>.
              In forced-colors the ring becomes a real <code>Highlight</code> outline and the listbox / options map to
              system colors; reduced-motion drops the caret rotation and the panel-entrance animation. All of this comes
              from the real <code>select.css</code> / <code>menu.css</code> — this demo adds no component CSS, ARIA, or
              keyboard logic of its own.
            </p>
            <p className="demo-note">
              <strong>Edge cases:</strong> <code>options={'{[]}'}</code> renders an empty listbox with the placeholder,
              and an all-<code>disabled</code> list opens but selects nothing (arrow navigation is a no-op) — both are
              stable, shown here as notes rather than extra controls. There is no runtime option-shape validation, and
              the exports are browser-only (<code>window.Select</code> / <code>window.Combobox</code>).
            </p>
          </section>

        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
