<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — TopNav</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="nav.css" />
  <link rel="stylesheet" href="../button/button.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px 24px; }
    .stack { display: flex; flex-direction: column; gap: 28px; max-width: 1100px; margin: 0 auto; }
    .label { font: var(--ep-text-overline); letter-spacing: var(--ep-track-overline); text-transform: uppercase; color: var(--ep-fg-subtle); }
    @media (max-width: 720px) { body { padding: 24px 16px; } }
  </style>
</head>
<body>
  <div class="stack">
    <div>
      <p class="label">Desktop &amp; mobile (resize to ≤ 720px)</p>
    </div>

    <nav class="topnav" id="topnav-demo">
      <div class="topnav__brand">
        <img src="../../../eggproject-design/assets/logo-mark.svg" alt="">
        <b>EggProject</b>
      </div>

      <div class="topnav__links">
        <a class="is-on" href="#">Work</a>
        <a href="#">Services</a>
        <a href="#">Process</a>
        <a href="#">Journal</a>
      </div>

      <div class="topnav__actions">
        <button class="ep-theme-toggle" type="button" data-ep-theme-toggle aria-label="Switch to dark theme">
          <svg class="ep-theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ep-theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn btn--ghost">Sign in</button>
        <button class="btn btn--primary">Start a project</button>
      </div>

      <button class="topnav__toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="topnav-sheet">
        <svg class="icon-open"  width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <path d="M3 5h12M3 9h12M3 13h12"/>
        </svg>
        <svg class="icon-close" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <path d="M4 4l10 10M14 4L4 14"/>
        </svg>
      </button>

      <div class="topnav__sheet" id="topnav-sheet" role="menu">
        <a class="is-on" href="#" role="menuitem">Work</a>
        <a href="#" role="menuitem">Services</a>
        <a href="#" role="menuitem">Process</a>
        <a href="#" role="menuitem">Journal</a>
        <hr>
        <div class="topnav__sheet-actions">
          <button class="ep-theme-toggle" type="button" data-ep-theme-toggle aria-label="Switch to dark theme" style="align-self:flex-start;">
            <svg class="ep-theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="ep-theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="btn btn--ghost">Sign in</button>
          <button class="btn btn--primary">Start a project</button>
        </div>
      </div>
    </nav>
  </div>

  <script>
    (() => {
      const nav = document.getElementById('topnav-demo');
      const btn = nav.querySelector('.topnav__toggle');
      btn.addEventListener('click', () => {
        const open = nav.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      // Close when a sheet link is tapped
      nav.querySelectorAll('.topnav__sheet a').forEach(a => {
        a.addEventListener('click', () => {
          nav.classList.remove('is-open');
          btn.setAttribute('aria-expanded', 'false');
        });
      });
    })();
  </script>
</body>
</html>
