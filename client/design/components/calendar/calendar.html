<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — Calendar</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=720" />
  <link rel="stylesheet" href="calendar.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px; }
    .page { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
    h1 { font: 400 36px/1.1 var(--ep-font-display); letter-spacing: -0.02em; }
    h1 em { font-weight: 700; }
    .lead { font: var(--ep-text-body); color: var(--ep-fg-muted); }
    .label { font: var(--ep-text-overline); letter-spacing: var(--ep-track-overline); text-transform: uppercase; color: var(--ep-fg-subtle); }
    .row { display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .hint { font: var(--ep-text-meta); color: var(--ep-fg-subtle); }
  </style>
  <script src="../../assets/vendor/react.production.min.js"></script>
  <script src="../../assets/vendor/react-dom.production.min.js"></script>
  <script src="../../assets/vendor/babel.min.js"></script>
</head>
<body>
  <div class="page">
    <h1>Calendar · <em>date picker</em></h1>
    <p class="lead">Headless calendar component. Single date, range, and disabled-date modes.</p>
    <div class="row" id="root"></div>
  </div>
  <script type="text/babel" src="Calendar.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [single, setSingle] = useState(new Date(2026, 5, 15));
      const [range, setRange] = useState([new Date(2026, 5, 10), new Date(2026, 5, 18)]);
      const fmt = d => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

      return (
        <>
          <div style={{display:'flex',gap:32,flexWrap:'wrap',alignItems:'flex-start'}}>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <span className="label">Single date</span>
              <Calendar value={single} onChange={setSingle} />
              <span className="hint">Selected: {fmt(single)}</span>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <span className="label">Date range · min/max bounds</span>
              <Calendar mode="range" value={range} onChange={setRange} minDate={new Date(2026, 5, 4)} maxDate={new Date(2026, 5, 26)} />
              <span className="hint">Range: {fmt(range[0])} → {fmt(range[1])} · Jun 4–26 selectable</span>
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
