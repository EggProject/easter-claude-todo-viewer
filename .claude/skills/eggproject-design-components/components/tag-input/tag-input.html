<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — TagInput</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=720" />
  <link rel="stylesheet" href="tag-input.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px; }
    .page { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    h1 { font: 400 36px/1.1 var(--ep-font-display); letter-spacing: -0.02em; color: var(--ep-fg); }
 h1 em { font-weight: 700; }
    .label { font: 500 12px var(--ep-font-sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ep-fg-muted); margin-bottom: 6px; display: block; }
    .frame { display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Tag input · <em>multi-value field</em></h1>

    <div class="frame">
      <div>
        <label class="label">Project tags · blue</label>
        <div class="tagi">
          <span class="tagi__tag tagi__tag--blue"><span class="tagi__tag-text">retainer</span><button class="tagi__tag-x" aria-label="Remove retainer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <span class="tagi__tag tagi__tag--blue"><span class="tagi__tag-text">fintech</span><button class="tagi__tag-x" aria-label="Remove fintech"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <span class="tagi__tag tagi__tag--blue"><span class="tagi__tag-text">phase II</span><button class="tagi__tag-x" aria-label="Remove phase II"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <input class="tagi__input" placeholder="Add a tag…">
        </div>
      </div>

      <div>
        <label class="label">Invitees · ink (e-mails)</label>
        <div class="tagi">
          <span class="tagi__tag tagi__tag--ink"><span class="tagi__tag-text">eszter@northbeam.co</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <span class="tagi__tag tagi__tag--ink"><span class="tagi__tag-text">lili@lumenwerk.de</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <input class="tagi__input" placeholder="Invite by email…">
        </div>
      </div>

      <div>
        <label class="label">Focus areas · yolk</label>
        <div class="tagi is-focused">
          <span class="tagi__tag tagi__tag--yolk"><span class="tagi__tag-text">brand</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <span class="tagi__tag tagi__tag--yolk"><span class="tagi__tag-text">type system</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <input class="tagi__input" placeholder="Add focus area…">
        </div>
      </div>

      <div>
        <label class="label">Skills · paper (subtle)</label>
        <div class="tagi">
          <span class="tagi__tag tagi__tag--paper"><span class="tagi__tag-text">TypeScript</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <span class="tagi__tag tagi__tag--paper"><span class="tagi__tag-text">Postgres</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <span class="tagi__tag tagi__tag--paper"><span class="tagi__tag-text">React</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <span class="tagi__tag tagi__tag--paper"><span class="tagi__tag-text">Stripe</span><button class="tagi__tag-x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></span>
          <input class="tagi__input" placeholder="Add a skill…">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
