<!DOCTYPE html>
<!-- @dsCard group="Trade" name="Demo · Chart focus" subtitle="lc-wrap: candles, area, sparklines" -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — Chart Focus</title>
  <script src="../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=900" />
  <link rel="icon" href="../../eggproject-design/assets/logo-mark.svg" />
  <link rel="stylesheet" href="../components/lc-wrap/lc-wrap.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ep-bg);
      color: var(--ep-fg);
      font-family: var(--ep-font-sans);
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 900px;
    }
    .label {
      font: var(--ep-text-overline);
      letter-spacing: var(--ep-track-overline);
      text-transform: uppercase;
      color: var(--ep-fg-subtle);
      margin-bottom: 8px;
    }
    .row { display: flex; gap: 12px; }
    .mini {
      position: relative;
      width: 160px;
      height: 48px;
      border-radius: var(--ep-radius-sm);
      background: var(--ep-bg-sunken);
      overflow: hidden;
      flex: 0 0 auto;
    }
    .mini .line-chart-plot { position: absolute; inset: 0; }
  </style>
</head>
<body>

  <div>
    <div class="label">Candlestick — BTCUSDT · 5m (with entry/exit markers)</div>
    <section class="line-chart-wrapper" style="height:320px;">
      <header class="line-chart-wrapper__header">
        <div class="line-chart-wrapper__title-group">
          <span class="line-chart-wrapper__symbol">BTCUSDT</span>
          <span class="line-chart-wrapper__meta">5m</span>
          <span class="line-chart-wrapper__price">68,412.30 <span class="line-chart-wrapper__delta line-chart-wrapper__delta--up">+1.24%</span></span>
        </div>
        <div class="line-chart-wrapper__actions">
          <div class="line-chart-wrapper__ranges" role="radiogroup" aria-label="Time range">
            <button class="line-chart-wrapper__range-button" type="button" role="radio" aria-checked="false" tabindex="-1">1m</button>
            <button class="line-chart-wrapper__range-button" type="button" role="radio" aria-checked="true" tabindex="0">5m</button>
            <button class="line-chart-wrapper__range-button" type="button" role="radio" aria-checked="false" tabindex="-1">15m</button>
            <button class="line-chart-wrapper__range-button" type="button" role="radio" aria-checked="false" tabindex="-1">1H</button>
            <button class="line-chart-wrapper__range-button" type="button" role="radio" aria-checked="false" tabindex="-1">4H</button>
            <button class="line-chart-wrapper__range-button" type="button" role="radio" aria-checked="false" tabindex="-1">1D</button>
          </div>
        </div>
      </header>
      <div class="line-chart-wrapper__body">
        <div class="line-chart-plot"
             data-lc="candles"
             data-lc-seed="11"
             data-lc-base="67900"
             data-lc-vol="120"
             data-lc-drift="9"
             data-lc-count="90"
             data-lc-markers='[{"i":20,"position":"belowBar","text":"Entry · 67,920"},{"i":65,"position":"aboveBar","text":"Exit · 68,310"}]'></div>
      </div>
      <div class="line-chart-wrapper__legend">
        <span class="line-chart-wrapper__legend-item"><span class="line-chart-wrapper__legend-swatch line-chart-wrapper__legend-swatch--candle-up"></span>Up</span>
        <span class="line-chart-wrapper__legend-item"><span class="line-chart-wrapper__legend-swatch line-chart-wrapper__legend-swatch--candle-down"></span>Down</span>
        <span class="line-chart-wrapper__legend-item"><span class="line-chart-wrapper__legend-swatch" style="background:var(--ep-yolk-500);border-radius:50%;"></span>Markers</span>
      </div>
      <div class="line-chart-wrapper__footer"><span>110 candles · lightweight-charts v5</span></div>
    </section>
  </div>

  <div>
    <div class="label">Area — ETHUSDT (ink dark variant)</div>
    <section class="line-chart-wrapper line-chart-wrapper--ink" style="height:220px;">
      <header class="line-chart-wrapper__header">
        <div class="line-chart-wrapper__title-group">
          <span class="line-chart-wrapper__symbol">ETHUSDT</span>
          <span class="line-chart-wrapper__meta">1H</span>
          <span class="line-chart-wrapper__price">3,418.62 <span class="line-chart-wrapper__delta line-chart-wrapper__delta--up">+2.34%</span></span>
        </div>
      </header>
      <div class="line-chart-wrapper__body">
        <div class="line-chart-plot" data-lc="area" data-lc-seed="3" data-lc-base="3350" data-lc-vol="28" data-lc-drift="2.2" data-lc-count="84"></div>
      </div>
      <div class="line-chart-wrapper__footer"><span>84 points</span></div>
    </section>
  </div>

  <div>
    <div class="label">Sparklines — watchlist mini-charts</div>
    <div class="row">
      <div class="mini">
        <div class="line-chart-plot" data-lc="sparkline" data-lc-seed="3" data-lc-drift="0.9" data-lc-color="#2F9C6A"></div>
      </div>
      <div class="mini">
        <div class="line-chart-plot" data-lc="sparkline" data-lc-seed="9" data-lc-drift="-0.8" data-lc-color="#C7384E"></div>
      </div>
      <div class="mini">
        <div class="line-chart-plot" data-lc="sparkline" data-lc-seed="14" data-lc-drift="0.05" data-lc-vol="2" data-lc-color="#D4831A"></div>
      </div>
      <div class="mini" style="opacity:0.5;">
        <div class="line-chart-plot" data-lc="sparkline" data-lc-seed="5" data-lc-drift="-0.3" data-lc-count="16" data-lc-color="#C7384E"></div>
      </div>
    </div>
  </div>

</body>
<script src="../assets/vendor/lightweight-charts.standalone.production.js"></script>
<script src="../components/lc-wrap/lc-charts.js"></script>
</html>
