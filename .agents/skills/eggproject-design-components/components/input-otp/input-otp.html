<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — Input OTP</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=720" />
  <link rel="stylesheet" href="input-otp.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px; }
    .page { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
    h1 { font: 400 36px/1.1 var(--ep-font-display); letter-spacing: -0.02em; }
    h1 em { font-weight: 700; }
    .lead { font: var(--ep-text-body); color: var(--ep-fg-muted); }
    .label { font: var(--ep-text-overline); letter-spacing: var(--ep-track-overline); text-transform: uppercase; color: var(--ep-fg-subtle); }
    .hint { font: var(--ep-text-meta); color: var(--ep-fg-subtle); margin-top: 8px; }
    .section { display: flex; flex-direction: column; gap: 10px; }
  </style>
  <script src="../../assets/vendor/react.production.min.js"></script>
  <script src="../../assets/vendor/react-dom.production.min.js"></script>
  <script src="../../assets/vendor/babel.min.js"></script>
</head>
<body>
  <div class="page">
    <h1>Input OTP · <em>one-time codes</em></h1>
    <p class="lead">Digit-slot input for SMS/email verification codes. Supports paste, backspace navigation, status states.</p>
    <div id="root"></div>
  </div>
  <script type="text/babel" src="InputOTP.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    function App() {
      const [status, setStatus] = useState(null);
      const [code, setCode] = useState('');

      const handleComplete = (val) => {
        setCode(val);
        setStatus(val === '123456' ? 'success' : 'error');
        setTimeout(() => setStatus(null), 2000);
      };

      return (
        <div style={{display:'flex',flexDirection:'column',gap:28}}>
          <div className="section">
            <span className="label">6-digit code</span>
            <InputOTP length={6} onComplete={handleComplete} status={status} />
            <p className="hint">Try typing "123456" for success, anything else for error.</p>
          </div>
          <div className="section">
            <span className="label">With separator</span>
            <InputOTP length={6} separator separatorAt={3} />
            <p className="hint">Separator after slot 3.</p>
          </div>
          <div className="section">
            <span className="label">Small (sm)</span>
            <div className="input-otp--sm"><InputOTP length={4} /></div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
