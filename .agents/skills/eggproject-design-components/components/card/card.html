<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — Card</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=720" />
  <link rel="stylesheet" href="card.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card__header">
      <div class="card__icn">E</div>
      <h3>Project Atlas</h3>
    </div>
    <p>A reusable cards pattern. Light surface, subtle border, elevation only on hover.</p>
    <div class="card__meta"><span>Last edit · 2h ago</span><span>v2.4</span></div>
  </div>
  <div class="card card--feature">
    <div class="card__header">
      <div class="card__icn">E</div>
      <h3>Crafted <em>shipping.</em></h3>
    </div>
    <p>Dark feature card — used for hero blocks, testimonials, and CTAs. Same scaffold, inverted surface.</p>
    <div class="card__meta"><span>Feature variant</span><span>--ep-ink-900</span></div>
  </div>
</body>
</html>
