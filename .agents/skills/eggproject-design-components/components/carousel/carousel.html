<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EggProject — Carousel</title>
  <script src="../../../eggproject-design/preview/_theme.js" defer></script>
  <meta name="viewport" content="width=720" />
  <link rel="stylesheet" href="carousel.css" />
  <link rel="icon" href="../../../eggproject-design/assets/logo-mark.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ep-bg); color: var(--ep-fg); font-family: var(--ep-font-sans); padding: 40px; }
    .page { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
    h1 { font: 400 36px/1.1 var(--ep-font-display); letter-spacing: -0.02em; }
    h1 em { font-weight: 700; }
    .lead { font: var(--ep-text-body); color: var(--ep-fg-muted); }
    .label { font: var(--ep-text-overline); letter-spacing: var(--ep-track-overline); text-transform: uppercase; color: var(--ep-fg-subtle); }
    .slide-inner {
      height: 220px;
      display: flex; align-items: center; justify-content: center;
      font: 700 24px/1 var(--ep-font-display);
      letter-spacing: -0.02em;
    }
  </style>
  <script src="../../assets/vendor/react.production.min.js"></script>
  <script src="../../assets/vendor/react-dom.production.min.js"></script>
  <script src="../../assets/vendor/babel.min.js"></script>
</head>
<body>
  <div class="page">
    <h1>Carousel · <em>slide deck</em></h1>
    <p class="lead">CSS-animated slide carousel with prev/next and dot navigation. Supports auto-play.</p>
    <span class="label">Slides</span>
    <div id="root"></div>
  </div>
  <script type="text/babel" src="Carousel.jsx"></script>
  <script type="text/babel">
    const slides = [
      { label: 'Lumenwerk', color: 'var(--ep-second-bg)', fg: 'var(--ep-second-fg)' },
      { label: 'Northbeam', color: 'var(--ep-accent-bg)', fg: 'var(--ep-accent-fg)' },
      { label: 'Orion Labs', color: 'var(--ep-bg-sunken)', fg: 'var(--ep-fg-muted)' },
      { label: 'Volta Fleet', color: 'var(--ep-success-bg)', fg: 'var(--ep-success)' },
    ];

    function App() {
      return (
        <Carousel showDots>
          {slides.map((s, i) => (
            <div key={i} className="slide-inner" style={{ background: s.color, color: s.fg }}>
              {s.label}
            </div>
          ))}
        </Carousel>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
